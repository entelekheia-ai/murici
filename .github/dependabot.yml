version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Integration branch of the release-channel flow (CONTRIBUTING.md § Branches & release channels).
    target-branch: alpha
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      ai-sdk:
        patterns: ["ai", "@ai-sdk/*"]
      dot-agent:
        patterns: ["@dot-agent/*"]
      radix:
        patterns: ["@radix-ui/*"]
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: alpha
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
